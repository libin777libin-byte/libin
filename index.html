        }

        .zoom-img:hover img {

        }

        .fly-item {
            position: fixed;
            pointer-events: none;
            z-index: 99999;
            border-radius: 8px;
            object-fit: cover
        }

        @keyframes pageIn {
            0% {

                transform: scale(1.04)
            }

            100% {
                opacity: 1;
                filter: blur(0);
                transform: scale(1)
            }
        }

        .page-in {
            animation: pageIn 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards
        }

        .field-float {
            position: relative;
            margin-bottom: 1.5rem
        }

        .field-float input,
        .field-float textarea {
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #f5f5f5;
            padding: 1rem 1rem 0.5rem;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s
        }

        .field-float input:focus,
        .field-float textarea:focus {
            border-color: #00ffcc
        }

        .field-float label {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.75rem;
            color: #888;
            text-transform: uppercase;

            font-size: 0.6rem;

</head>

            const set = useCallback(v => { setVal(prev => { const next = typeof v === 'function' ? v(prev) : v; try { localStorage.setItem(key, JSON.stringify(next)) } catch { } return next }); }, [key]);

        const ScrollProgress = () => {

            useEffect(() => {
                const el = ref.current;
                const onScroll = () => { const s = document.documentElement.scrollTop, h = document.documentElement.scrollHeight - window.innerHeight; if (el) el.style.width = (h > 0 ? Math.min(100, s / h * 100) : 0) + '%'; };

                const img = imgRef.current;
                const cartEl = cartIconRef?.current;
                if (!img || !cartEl) return;
                const sr = img.getBoundingClientRect(), tr = cartEl.getBoundingClientRect();

                Object.assign(fly.style, { position: 'fixed', left: sr.left + 'px', top: sr.top + 'px', width: sr.width + 'px', height: sr.height + 'px', objectFit: 'cover', borderRadius: '4px', zIndex: '99999', pointerEvents: 'none', transition: 'all 0.7s cubic-bezier(0.2,0.8,0.2,1)', opacity: '1' });

                        {['products', 'orders'].map(t => <button key={t} onClick={() => setTab(t)} className={`px-6 py-3 font-black text-xs uppercase tracking-widest border transition-colors ${tab === t ? 'border-neon bg-neon text-dark' : 'border-white/10 text-white hover:border-white/40'}`}>{t}</button>)}
                    </div>
                    {tab === 'products' ? <div className="overflow-x-auto w-full border border-white/5 bg-[#050505] p-6 text-white"><table className="w-full text-left font-mono text-xs"><thead className="bg-[#111] text-[10px] uppercase tracking-widest text-muted"><tr><th className="p-4">ID</th><th className="p-4">Name</th><th className="p-4">Category</th><th className="p-4">Price</th><th className="p-4">Stock</th><th className="p-4 text-right">Status</th></tr></thead><tbody>{PRODUCTS.map(p => <tr key={p.id} className="border-t border-white/5 hover:bg-white/5"><td className="p-4 text-neon">{p.id}</td><td className="p-4 font-bold">{p.name}</td><td className="p-4 text-muted">{p.category}</td><td className="p-4">₹{p.price}</td><td className="p-4">{p.stock}</td><td className="p-4 text-right">{p.trending ? <span className="text-neon border border-neon/30 px-2 py-1 text-[9px] uppercase tracking-widest font-black">Trending</span> : <span className="text-muted px-2 py-1 text-[9px] uppercase tracking-widest font-bold border border-white/10">Standard</span>}</td></tr>)}</tbody></table></div> :
                        <div className="py-20 text-center border border-white/10 border-dashed bg-[#050505]"><p className="text-muted text-xs uppercase font-bold tracking-widest mb-4">No recent system orders detected in local storage.</p></div>}
                </motion.div>
            );
        };

        /* ── HOME VIEW ── */
        const Home = ({ nav }) => {
            return (
                <div className="w-full">
                    <section className="relative h-[85vh] sm:h-screen w-full flex items-center justify-center overflow-hidden">
                        <video autoPlay loop muted playsInline className="absolute top-0 left-0 w-full h-full object-cover opacity-60"><source src="https://player.vimeo.com/external/494252666.sd.mp4?s=2bc38c715ea0846c986eb49bcf2360f0891d4e11&profile_id=164&oauth2_token_id=57447761" type="video/mp4" /></video>
                        <div className="absolute inset-0 bg-gradient-to-t from-dark via-dark/40 to-transparent"></div>
                        <div className="absolute inset-0 bg-[radial-gradient(circle_at_center,rgba(0,255,204,0.05)_0%,transparent_60%)]"></div>
                        <motion.div initial={{ opacity: 0, y: 40 }} animate={{ opacity: 1, y: 0 }} transition={{ duration: 1, delay: 0.2, ease: [0.2, 0.8, 0.2, 1] }} className="relative z-10 text-center px-4 w-full">
                            <motion.p initial={{ opacity: 0, letterSpacing: '0em' }} animate={{ opacity: 1, letterSpacing: '0.4em' }} transition={{ duration: 1.5, delay: 0.5 }} className="text-neon font-bold text-xs uppercase mb-6 sm:mb-8">FW // 2026 Collection</motion.p>
                            <h1 className="text-6xl sm:text-[10vw] font-black uppercase tracking-tighter leading-[0.85] mb-8">System <br /><span className="text-transparent" style={{ WebkitTextStroke: '1px rgba(255,255,255,0.8)' }}>Override</span></h1>
                            <button onClick={() => nav('/new')} className="group relative inline-flex items-center justify-center px-8 py-5 sm:px-12 sm:py-6 bg-white text-dark font-black tracking-widest text-xs sm:text-sm uppercase overflow-hidden transition-colors">
                                <span className="relative z-10 group-hover:text-neon transition-colors duration-300">Initialize Sequence</span>
                                <div className="absolute inset-0 bg-dark translate-y-full group-hover:translate-y-0 transition-transform duration-500 ease-[cubic-bezier(0.2,0.8,0.2,1)]"></div>
                                <div className="absolute top-0 right-0 w-2 h-2 border-t-2 border-r-2 border-neon opacity-0 group-hover:opacity-100 transition-opacity"></div>
                                <div className="absolute bottom-0 left-0 w-2 h-2 border-b-2 border-l-2 border-neon opacity-0 group-hover:opacity-100 transition-opacity"></div>
                            </button>
                        </motion.div>
                    </section>
                    <section className="py-32 container mx-auto px-6">
                        <h2 className="text-4xl font-black uppercase tracking-tighter mb-16 text-center text-white"><span className="border-b border-neon pb-4">Trending Algorithms</span></h2>
                        <div className="grid grid-cols-2 md:grid-cols-4 gap-6 md:gap-8">
                            {PRODUCTS.filter(p => p.trending).slice(0, 4).map(p => <ProductCard key={p.id} product={p} nav={nav} />)}
                        </div>
                    </section>
                    <section className="w-full relative py-32 bg-[#050505]">
                        <div className="container mx-auto px-6 grid md:grid-cols-2 gap-12 lg:gap-24 items-center">
                            <div className="aspect-[4/3] w-full overflow-hidden bg-white/5"><video autoPlay loop muted playsInline className="w-full h-full object-cover opacity-60"><source src="https://player.vimeo.com/external/394628281.sd.mp4?s=564501ebd6ec3eb93dcf06c57fbedbc9e0aae0b8&profile_id=164&oauth2_token_id=57447761" type="video/mp4" /></video></div>
                            <div className="space-y-8">
                                <h2 className="text-4xl lg:text-6xl font-black uppercase tracking-tighter text-white">The Syntax of <br /><span className="text-neon">Techwear</span></h2>
                                <p className="text-muted leading-relaxed max-w-lg font-semibold text-sm">Engineered utility meets dystopian luxury. Explore garments structured for urban resilience, built to outlast the system.</p>
                                <button onClick={() => nav('/men')} className="px-10 py-5 border border-white/20 hover:border-neon font-black text-xs tracking-widest text-white uppercase hover:text-neon hover:bg-neon/5 transition-all">Access Men's</button>
                            </div>
                        </div>
                    </section>
                </div>
            );
        };

        /* ── WISHLIST VIEW ── */
        const WishlistView = ({ wishlist, toggleWish, addToCart, nav }) => {
            const prods = PRODUCTS.filter(p => wishlist.includes(p.id));
            return (
                <motion.div initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }} className="container mx-auto px-6 py-24 sm:py-32">
                    <h2 className="text-4xl font-black uppercase tracking-tighter mb-12 border-b border-white/10 pb-6">Your Wishlist</h2>
                    {prods.length === 0 ? <div className="py-32 text-center text-muted uppercase font-bold tracking-widest text-sm">Wishlist is currently empty.<br /><button onClick={() => nav('/')} className="mt-8 text-neon border border-neon px-8 py-4 hover:bg-neon hover:text-dark transition-colors">Return to Grid</button></div> :
                        <div className="grid grid-cols-2 md:grid-cols-4 gap-6">
                            {prods.map(p => <ProductCard key={p.id} product={p} addToCart={addToCart} toggleWish={toggleWish} wishlist={wishlist} nav={nav} />)}
                        </div>}
                </motion.div>
            );
        };

        /* ── MAIN APP COMPONENT ── */
        const App = () => {
            const { route, nav } = useRoute();
            const [cart, setCart] = useLocalStorage('matrix_cart', []);
            const [wishlist, setWishlist] = useLocalStorage('matrix_wish', []);
            const [user, setUser] = useLocalStorage('matrix_user', null);

            const [isCartOpen, setCartOpen] = useState(false);
            const [isSearchOpen, setSearchOpen] = useState(false);
            const [isAuthOpen, setAuthOpen] = useState(false);
            const [isCheckoutOpen, setCheckoutOpen] = useState(false);
            const [orderId, setOrderId] = useState(null);
            const cartIconRef = useRef(null);

            useEffect(() => { safeIcons(); }, [route, isCartOpen, isSearchOpen, isAuthOpen, isCheckoutOpen, orderId]);
            useEffect(() => { window.scrollTo(0, 0); }, [route]);

            const toggleWish = id => setWishlist(prev => prev.includes(id) ? prev.filter(i => i !== id) : [...prev, id]);
            const addToCart = p => { setCart(c => { const i = c.findIndex(x => x.id === p.id && x._size === p._size); if (i >= 0) { const nc = [...c]; nc[i]._qty += (p._qty || 1); return nc; } return [...c, { ...p, _qty: p._qty || 1, _size: p._size || p.sizes?.[0] || 'OS' }]; }); };

            return (
                <div className="page-in">
                    <div className="noise-overlay" />
                    <ScrollProgress />

                    {/* HEADER */}
                    <nav className="fixed top-0 left-0 w-full z-50 glass py-4">
                        <div className="container mx-auto px-6 flex justify-between items-center">
                            <Logo nav={nav} />
                            <div className="hidden md:flex gap-10">
                                {['/', '/women', '/men', '/new'].map(r => (
                                    <button key={r} onClick={() => nav(r)} className={`relative text-xs font-black tracking-widest uppercase transition-colors hover:text-white ${route === r ? 'text-white' : 'text-muted'}`}>
                                        {r === '/' ? 'Home' : r.replace('/', '')}
                                        {route === r && <motion.div layoutId="navline" className="absolute -bottom-2 left-0 w-full h-[2px] bg-neon" />}
                                    </button>
                                ))}
                            </div>
                            <div className="flex items-center gap-6 text-white">
                                <button onClick={() => setSearchOpen(true)} className="hover:text-neon transition-colors"><i data-lucide="search" className="w-5 h-5"></i></button>
                                <button onClick={() => { if (!user) setAuthOpen(true); else user.isAdmin ? nav('/admin') : setAuthOpen(false); }} title={user ? `Logged in as ${user.name}` : 'Sign In'} className={`hover:text-neon transition-colors hidden sm:block ${user ? 'text-neon' : ''}`}><i data-lucide="user" className="w-5 h-5"></i></button>
                                <button onClick={() => nav('/wishlist')} className="relative hover:text-neon transition-colors hidden sm:block">
                                    <i data-lucide="heart" className={`w-5 h-5 ${wishlist.length > 0 ? 'fill-neon text-neon' : ''}`}></i>
                                </button>
                                <button onClick={() => setCartOpen(true)} className="relative hover:text-neon transition-colors group">
                                    <i ref={cartIconRef} data-lucide="shopping-bag" className="w-5 h-5 group-hover:text-neon transition-colors"></i>
                                    {cart.reduce((s, i) => s + i._qty, 0) > 0 && <span className="absolute -top-2 -right-2 bg-neon text-dark text-[9px] font-black w-4 h-4 rounded-full flex items-center justify-center">{cart.reduce((s, i) => s + i._qty, 0)}</span>}
                                </button>
                            </div>
                        </div>
                    </nav>

                    {/* OVERLAYS */}
                    <SearchOverlay isOpen={isSearchOpen} onClose={() => setSearchOpen(false)} nav={nav} />
                    <CartDrawer isOpen={isCartOpen} onClose={() => setCartOpen(false)} cart={cart} setCart={setCart} onCheckout={() => setCheckoutOpen(true)} onAuthOpen={() => setAuthOpen(true)} user={user} />
                    <AuthModal isOpen={isAuthOpen} onClose={() => setAuthOpen(false)} setUser={setUser} />
                    <CheckoutModal isOpen={isCheckoutOpen} onClose={() => setCheckoutOpen(false)} cart={cart} onSuccess={id => { setOrderId(id); setCheckoutOpen(false); setCart([]); }} />
                    <SuccessModal isOpen={!!orderId} onClose={() => setOrderId(null)} orderId={orderId} />

                    {/* ROUTER ── */}
                    <div className="min-h-screen pb-16">
                        <AnimatePresence mode="wait">
                            <div key={route}>
                                {route === '/' && <Home nav={nav} />}
                                {route === '/women' && <Catalog title="Women's System" category="Women" addToCart={addToCart} toggleWish={toggleWish} wishlist={wishlist} nav={nav} />}
                                {route === '/men' && <Catalog title="Men's Syntax" category="Men" addToCart={addToCart} toggleWish={toggleWish} wishlist={wishlist} nav={nav} />}
                                {route === '/new' && <Catalog title="New Parameters" category="New" addToCart={addToCart} toggleWish={toggleWish} wishlist={wishlist} nav={nav} />}
                                {route === '/wishlist' && <WishlistView addToCart={addToCart} toggleWish={toggleWish} wishlist={wishlist} nav={nav} />}
                                {route === '/admin' && <Admin user={user} />}
                                {route.startsWith('/product/') && <ProductDetail id={route.split('/')[2]} addToCart={addToCart} toggleWish={toggleWish} wishlist={wishlist} nav={nav} />}
                            </div>
                        </AnimatePresence>
                    </div>

                    <footer className="border-t border-white/5 py-16 text-center">
                        <Logo nav={nav} />
                        {user && <div className="mt-4 flex gap-4 justify-center items-center"><span className="text-xs font-bold text-muted uppercase tracking-widest">Logged in: {user.name}</span><button onClick={() => setUser(null)} className="text-[10px] text-neon uppercase tracking-widest border-b border-neon">Logout</button></div>}
                        <p className="text-[10px] text-muted uppercase font-bold tracking-widest mt-6">© 2026 Matrix System. Standardized Reality Protocol.</p>
                        <div className="flex justify-center gap-6 mt-6">
                            <i data-lucide="instagram" className="w-5 h-5 text-muted hover:text-neon cursor-pointer transition-colors"></i>
                            <i data-lucide="twitter" className="w-5 h-5 text-muted hover:text-neon cursor-pointer transition-colors"></i>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
